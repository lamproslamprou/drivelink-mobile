    <!-- Share tags and organization data. Defaults for any route; the
         page-meta edge function (netlify/edge-functions/page-meta.js) swaps in
         per-page values for the main routes. -->
    <link rel="canonical" href="https://drivelink.deals/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DriveLink" />
    <meta property="og:title" content="DriveLink — Private Car Sales with Protected Payment (US)" />
    <meta property="og:description" content="Pay for a used car safely. The seller isn't paid until you have the keys and the signed title. U.S. private car sales, $0 to list." />
    <meta property="og:url" content="https://drivelink.deals/" />
    <meta property="og:image" content="https://drivelink.deals/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DriveLink — Private Car Sales with Protected Payment (US)" />
    <meta name="twitter:description" content="Pay for a used car safely. The seller isn't paid until you have the keys and the signed title. U.S. private car sales, $0 to list." />
    <meta name="twitter:image" content="https://drivelink.deals/icons/icon-512.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DriveLink",
      "legalName": "DriveLink LLC",
      "url": "https://drivelink.deals",
      "logo": "https://drivelink.deals/icons/icon-512.png",
      "email": "support@drivelink.deals",

    <!-- ── PWA ────────────────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!-- iOS ignores the manifest entirely for home-screen installs and reads
         these instead. Without apple-touch-icon it screenshots the page and
         uses that as the icon, which looks broken. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DriveLink" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZR5N15ZQZ1"></script>
    <script>
      // Internal browsers (admin, test accounts) stay out of GA4. Visit any page
      // with ?internal=1 to flag a browser, ?internal=0 to clear it. This runs
      // before gtag is configured so no hit is ever sent from a flagged browser.
      try {
        var q = new URLSearchParams(window.location.search).get('internal');
        if (q === '1') localStorage.setItem('dl_internal', '1');
        if (q === '0') localStorage.removeItem('dl_internal');
        if (localStorage.getItem('dl_internal') === '1' || window.location.pathname.indexOf('/admin') === 0) {
          window['ga-disable-G-ZR5N15ZQZ1'] = true;
        }
      } catch (e) { /* storage blocked: keep tracking */ }
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // send_page_view: false because App.jsx fires page_view on every route
      // change, including the first. Left at the default, gtag sends its own
      // pageview on load and every first visit is counted twice — which would
      // quietly inflate every number in the funnel.
      gtag('config', 'G-ZR5N15ZQZ1', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>

    <script>
      // Registered after load so it never competes with the app for bandwidth
      // on a first visit. Failure is non-fatal: no service worker just means no
      // offline shell and no install prompt.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.warn('Service worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
