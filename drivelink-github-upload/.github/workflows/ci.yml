name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"   # weekly: catches newly disclosed dependency vulnerabilities
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
