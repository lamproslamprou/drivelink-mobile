[build]
  command = "npm install && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  path = "/listing/*"
  function = "listing-meta"

[[redirects]]
  from = "/sitemap-listings.xml"
  to = "/.netlify/functions/sitemap-listings"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
