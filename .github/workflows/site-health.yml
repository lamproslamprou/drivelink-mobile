name: Site health

# Signed-out robustness checks against the live site, as a phone on a slow
# connection. A failed run emails the repo owner (GitHub's default for failed
# scheduled workflows). Nothing here creates accounts or enters credentials.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "site-health/**"
      - ".github/**"

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site-health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for Netlify to publish the push
        if: github.event_name == 'push'
        run: sleep 240
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Keep the report when something breaks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            site-health/playwright-report
            site-health/test-results
          retention-days: 14
